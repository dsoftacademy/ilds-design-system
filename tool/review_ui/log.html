<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ILDS UI Review Portal — Decision log</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div id="header-root"></div>
<main>
  <h2>Decision log</h2>
  <div class="log-scroll">
    <table class="log-table" id="log-table">
      <thead>
        <tr><th>#</th><th>Time</th><th>Item</th><th>Verdict</th><th>State</th><th>Reviewer</th></tr>
      </thead>
      <tbody id="log-body"></tbody>
    </table>
  </div>
  <div class="empty" id="empty" hidden>No decisions recorded yet.</div>
</main>
<script type="module">
import { headerHtml, initPortal, escHtml } from '/portal.js';

const $ = (s) => document.querySelector(s);
document.getElementById('header-root').innerHTML = headerHtml({ activePage: 'log' });

async function loadLog() {
  const r = await fetch('/api/log', { credentials: 'include' });
  if (r.status === 401) {
    window.location.href = '/login';
    return;
  }
  const d = await r.json();
  const body = $('#log-body');
  body.innerHTML = '';
  if (!d.entries?.length) {
    $('#empty').hidden = false;
    $('#log-table').hidden = true;
    return;
  }
  $('#empty').hidden = true;
  $('#log-table').hidden = false;
  for (const e of d.entries) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${e.serial}</td><td>${new Date(e.at).toLocaleString()}</td><td>${escHtml(e.label)}</td><td>${escHtml(e.verdict)}</td><td>${escHtml(e.state)}</td><td>${escHtml(e.reviewer)}</td>`;
    body.appendChild(tr);
  }
}

await initPortal({ activePage: 'log', onProfileChange: loadLog });
loadLog();
</script>
</body>
</html>
