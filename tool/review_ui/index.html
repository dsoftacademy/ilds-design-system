<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ILDS Review</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="app-header">
  <h1>ILDS Review</h1>
  <div class="header-spacer"></div>
  <a class="header-link" href="/log">Check log</a>
  <span class="header-user" id="who"></span>
  <button type="button" class="btn-ghost" id="logout-btn">Logout</button>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<div class="modal-backdrop" id="logout-modal">
  <div class="modal" role="dialog" aria-labelledby="logout-title">
    <h3 id="logout-title">Log out?</h3>
    <p>You will need to sign in again with your GitHub token.</p>
    <div class="modal-actions">
      <button type="button" class="btn-ghost" id="logout-cancel">Cancel</button>
      <button type="button" class="action fail" id="logout-confirm">Logout</button>
    </div>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
let state = null;

function escAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

function previewBlock(url) {
  return `<div class="preview-wrap">
    <iframe class="preview-frame" src="${escAttr(url)}" title="Component preview"></iframe>
    <a class="preview-tab" target="_blank" rel="noopener" href="${escAttr(url)}">Open full playground ↗</a>
  </div>`;
}

function card(item, kind) {
  const el = document.createElement('div');
  el.className = 'card';
  const isCp = item.type === 'control-plane';
  const label = kind === 'pr' ? `PR #${item.number}` : 'Post-merge check';
  const badge = isCp ? '<span class="badge cp">CONTROL-PLANE</span>' : '<span class="badge content">COMPONENT</span>';
  const section = item.section || item.objective || '';
  const hasPreview = !isCp && item.playgroundUrl;
  const preview = hasPreview ? previewBlock(item.playgroundUrl) : '';
  const heading = isCp ? 'What changes, why, and the risk:' : 'What to check:';

  if (kind === 'pr' && !item.ready) {
    el.innerHTML = `<div class="top">${badge}<span class="title">${label} — ${item.title}</span></div>
      <div class="waiting">⏳ ${item.waitingReason}</div>`;
    return el;
  }
  if (kind === 'queue' && item.status !== 'pending') {
    el.innerHTML = `<div class="top">${badge}<span class="title">${item.title}</span></div>
      <div class="done">Verdict recorded: ${item.status}</div>`;
    return el;
  }
  el.innerHTML = `
    <div class="top">${badge}<span class="title">${label} — ${item.title}</span></div>
    <div><strong>${heading}</strong></div>
    <div class="objective"></div>
    <div class="row">
      <button class="action pass">${isCp ? 'Authorize' : 'Pass'}</button>
      <button class="action fail">${isCp ? 'Reject' : 'Fail'}</button>
    </div>
    ${preview}
    <textarea rows="3" placeholder="What looked wrong? Plain language — agents own the fix."></textarea>
    <div class="err"></div>`;
  el.querySelector('.objective').textContent = section;
  const ta = el.querySelector('textarea');
  const err = el.querySelector('.err');
  const send = async (verdict) => {
    if (verdict === 'fail' && !ta.value.trim()) { ta.style.display = 'block'; ta.focus(); return; }
    for (const b of el.querySelectorAll('button.action')) b.disabled = true;
    const url = kind === 'pr' ? '/api/verdict' : '/api/queue-verdict';
    const payload = kind === 'pr'
      ? { number: item.number, verdict, note: ta.value.trim() }
      : { id: item.id, verdict, note: ta.value.trim() };
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), credentials: 'include' });
    const d = await r.json();
    if (d.ok) load();
    else { err.textContent = d.error; for (const b of el.querySelectorAll('button.action')) b.disabled = false; }
  };
  el.querySelector('.pass').onclick = () => send('pass');
  el.querySelector('.fail').onclick = () => send('fail');
  if (state.readOnly) for (const b of el.querySelectorAll('button.action')) b.disabled = true;
  return el;
}

async function load() {
  const r = await fetch('/api/state', { credentials: 'include' });
  if (r.status === 401) { window.location.href = '/login'; return; }
  state = await r.json();
  $('#who').textContent = state.reviewer ? `Signed in as ${state.reviewer}` : '';
  const main = $('#main');
  main.innerHTML = '';
  const pendingQueue = state.queue.filter((q) => q.status === 'pending');
  const waitingCards = [
    ...state.prs.filter((p) => p.ready).map((p) => card(p, 'pr')),
    ...pendingQueue.map((q) => card(q, 'queue')),
  ];
  if (!waitingCards.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'No items for review.';
    main.appendChild(empty);
  } else {
    const h = document.createElement('h2');
    h.textContent = 'Waiting for your eyes';
    main.appendChild(h);
    for (const c of waitingCards) main.appendChild(c);
  }
  const secondary = [
    ['With the agents', state.prs.filter((p) => !p.ready).map((p) => card(p, 'pr'))],
    ['Recently decided', state.queue.filter((q) => q.status !== 'pending').map((q) => card(q, 'queue'))],
  ];
  for (const [title, cards] of secondary) {
    if (!cards.length) continue;
    const h = document.createElement('h2');
    h.textContent = title;
    main.appendChild(h);
    for (const c of cards) main.appendChild(c);
  }
}

$('#logout-btn').onclick = () => $('#logout-modal').classList.add('open');
$('#logout-cancel').onclick = () => $('#logout-modal').classList.remove('open');
$('#logout-confirm').onclick = async () => {
  await fetch('/api/logout', { method: 'POST', credentials: 'include' });
  window.location.href = '/login';
};

load();
setInterval(load, 60_000);
</script>
</body>
</html>
