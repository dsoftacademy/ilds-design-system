<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ILDS UI Review Portal</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div id="header-root"></div>
<main id="main"><div class="empty">Loading…</div></main>
<script type="module">
import {
  headerHtml,
  initPortal,
  notifyIfNewItems,
  platformPreviewHtml,
  bindPlatformTabs,
  escHtml,
} from '/portal.js';

const $ = (s) => document.querySelector(s);
let state = null;

document.getElementById('header-root').innerHTML = headerHtml({ activePage: 'review' });

function platformBadges(platforms) {
  if (!platforms?.length) return '';
  return platforms
    .map((p) => `<span class="badge platform">${escHtml(p.toUpperCase())}</span>`)
    .join('');
}

function card(item, kind) {
  const el = document.createElement('div');
  el.className = 'card';
  const isCp = item.type === 'control-plane';
  const label = kind === 'pr' ? `PR #${item.number}` : 'Post-merge check';
  const badge = isCp
    ? '<span class="badge cp">CONTROL-PLANE</span>'
    : '<span class="badge content">COMPONENT</span>';
  const section = item.section || item.objective || '';
  const platformTags = !isCp ? platformBadges(item.platforms) : '';
  const preview =
    !isCp && item.platformPreviews?.length
      ? platformPreviewHtml(item.platformPreviews)
      : '';
  const heading = isCp ? 'What changes, why, and the risk:' : 'What to check:';

  if (kind === 'pr' && !item.ready && !item.alreadyApproved) {
    el.innerHTML = `<div class="top">${badge}${platformTags}<span class="title">${label} — ${escHtml(item.title)}</span></div>
      <div class="waiting">⏳ ${escHtml(item.waitingReason)}</div>`;
    return el;
  }
  if ((kind === 'pr' && item.alreadyApproved) || (kind === 'queue' && item.status !== 'pending')) {
    const status =
      kind === 'pr'
        ? item.waitingReason || 'approved'
        : `Verdict recorded: ${item.status}`;
    el.innerHTML = `<div class="top">${badge}${platformTags}<span class="title">${kind === 'pr' ? `${label} — ${escHtml(item.title)}` : escHtml(item.title)}</span></div>
      <div class="done">${escHtml(status)}</div>`;
    return el;
  }
  el.innerHTML = `
    <div class="top">${badge}${platformTags}<span class="title">${label} — ${escHtml(item.title)}</span></div>
    <div><strong>${heading}</strong></div>
    <div class="objective"></div>
    <div class="row">
      <button type="button" class="action pass">${isCp ? 'Authorize' : 'Pass'}</button>
      <button type="button" class="action fail">${isCp ? 'Reject' : 'Fail'}</button>
    </div>
    ${preview}
    <textarea rows="3" placeholder="What looked wrong? Plain language — agents own the fix."></textarea>
    <div class="err"></div>`;
  el.querySelector('.objective').textContent = section;
  bindPlatformTabs(el);
  const ta = el.querySelector('textarea');
  const err = el.querySelector('.err');
  const send = async (verdict) => {
    if (verdict === 'fail' && !ta.value.trim()) {
      ta.style.display = 'block';
      ta.focus();
      return;
    }
    for (const b of el.querySelectorAll('button.action')) b.disabled = true;
    const url = kind === 'pr' ? '/api/verdict' : '/api/queue-verdict';
    const payload =
      kind === 'pr'
        ? { number: item.number, verdict, note: ta.value.trim() }
        : { id: item.id, verdict, note: ta.value.trim() };
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      credentials: 'include',
    });
    const d = await r.json();
    if (d.ok) load();
    else {
      err.textContent = d.error;
      for (const b of el.querySelectorAll('button.action')) b.disabled = false;
    }
  };
  el.querySelector('.pass').onclick = () => send('pass');
  el.querySelector('.fail').onclick = () => send('fail');
  if (state.readOnly) for (const b of el.querySelectorAll('button.action')) b.disabled = true;
  return el;
}

function serviceBanner(services) {
  const parts = [];
  if (!services.flutter) parts.push('Flutter playground offline (port 8080)');
  if (!services.storybook) parts.push('Storybook offline (port 6006)');
  if (!parts.length) return null;
  const el = document.createElement('div');
  el.className = 'service-warn';
  el.textContent = `${parts.join(' · ')} — native tabs still available.`;
  return el;
}

async function load() {
  const r = await fetch('/api/state', { credentials: 'include' });
  if (r.status === 401) {
    window.location.href = '/login';
    return;
  }
  state = await r.json();
  notifyIfNewItems(state);
  const main = $('#main');
  main.innerHTML = '';
  const warn = serviceBanner(state.services);
  if (warn) main.appendChild(warn);

  const pendingQueue = state.queue.filter((q) => q.status === 'pending');
  const waitingCards = [
    ...state.prs.filter((p) => p.ready).map((p) => card(p, 'pr')),
    ...pendingQueue.map((q) => card(q, 'queue')),
  ];
  if (!waitingCards.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'No items for review.';
    main.appendChild(empty);
  } else {
    const h = document.createElement('h2');
    h.textContent = 'Waiting for your eyes';
    main.appendChild(h);
    for (const c of waitingCards) main.appendChild(c);
  }
  const secondary = [
    ['With the agents', state.prs.filter((p) => !p.ready && !p.alreadyApproved).map((p) => card(p, 'pr'))],
    [
      'Recently decided',
      [
        ...state.prs.filter((p) => p.alreadyApproved).map((p) => card(p, 'pr')),
        ...state.queue.filter((q) => q.status !== 'pending').map((q) => card(q, 'queue')),
      ],
    ],
  ];
  for (const [title, cards] of secondary) {
    if (!cards.length) continue;
    const h = document.createElement('h2');
    h.textContent = title;
    main.appendChild(h);
    for (const c of cards) main.appendChild(c);
  }
}

await initPortal({ activePage: 'review', onProfileChange: load });
load();
setInterval(load, 20_000);
</script>
</body>
</html>
