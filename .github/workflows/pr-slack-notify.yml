name: PR Slack Notify

# Phase 5d — post to #design-system-updates when a PR is ready for review.
# 5d-1: SLACK_WEBHOOK_URL (notify-only)
# 5d-2: SLACK_BOT_TOKEN + SLACK_CHANNEL_ID (message with Approve / Request changes buttons)

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  notify:
    name: Slack notify on PR open
    runs-on: ubuntu-latest
    if: >-
      github.event.action == 'ready_for_review' ||
      (github.event.action == 'opened' && github.event.pull_request.draft == false)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Post Slack notification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_BOT_TOKEN:-}" ] && [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::Neither SLACK_BOT_TOKEN nor SLACK_WEBHOOK_URL is set — skipping Slack notification."
            echo "See docs/PHASE5_SLACK_NOTIFY.md and docs/PHASE5_SLACK_INTERACTIVE.md."
            exit 0
          fi
          if [ -n "${SLACK_BOT_TOKEN:-}" ] && [ -z "${SLACK_CHANNEL_ID:-}" ]; then
            echo "::error::SLACK_BOT_TOKEN is set but SLACK_CHANNEL_ID is missing."
            exit 1
          fi
          node tool/notify_pr_slack.mjs --pr "${{ github.event.pull_request.number }}"
