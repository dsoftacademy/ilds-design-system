name: PR Slack Notify

# Phase 5d — post to #design-system-updates when a PR needs human review (T1).
# T0 auto-merge PRs are silent — Phase 5f router handles classification + notify.
# Primary path: Selective Review Router workflow (T1 → Slack).
# This workflow remains for manual re-fire / acceptance testing.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to notify (acceptance / re-fire)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  notify:
    name: Slack notify on PR open
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Post Slack notification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_NOTIFY_INTERACTIVE: 'false'
          ILDS_REVIEW_UI_URL: 'http://localhost:4400'
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_BOT_TOKEN:-}" ] && [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::Neither SLACK_BOT_TOKEN nor SLACK_WEBHOOK_URL is set — skipping Slack notification."
            echo "See docs/PHASE5_SLACK_NOTIFY.md."
            exit 0
          fi
          if [ -n "${SLACK_BOT_TOKEN:-}" ] && [ -z "${SLACK_CHANNEL_ID:-}" ]; then
            echo "::error::SLACK_BOT_TOKEN is set but SLACK_CHANNEL_ID is missing."
            exit 1
          fi
          PR_NUMBER="${{ inputs.pr_number }}"
          node tool/notify_pr_slack.mjs --pr "$PR_NUMBER"
