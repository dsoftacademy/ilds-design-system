name: Adversary Review

# Required check on every merge — routes by path (see tool/adversary/pr_gate.mjs):
#   component paths → catalog + Opus judge
#   control-plane paths → test:integrity (L1–L8)
#   safe T0 only → explicit skip (Chromatic pattern)

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'web/src/**'
      - 'tokens/**'
      - 'tool/**'
      - 'docs/**'
      - '.github/**'
      - 'agents/**'
      - 'package.json'

permissions:
  contents: read
  pull-requests: write

jobs:
  adversary-review:
    name: adversary-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install adversary dependencies
        run: npm install --no-save @anthropic-ai/sdk@^0.39.0

      - name: Run PR gate (component adversary or control-plane integrity)
        id: adversary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ILDS_ADVERSARY_MODEL: claude-opus-4-8
          ILDS_ADVERSARY_REQUIRE_JUDGE: 'true'
        run: |
          set -euo pipefail
          node tool/adversary/pr_gate.mjs --pr ${{ github.event.pull_request.number }} --output /tmp/adversary-report.md
        continue-on-error: true

      - name: Post report on PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -f /tmp/adversary-report.md ]; then
            echo "No report generated"
            exit 0
          fi
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          PR="${{ github.event.pull_request.number }}"
          gh api "repos/${OWNER}/${REPO}/issues/${PR}/comments" \
            -f body="$(cat /tmp/adversary-report.md)"

      - name: Fail on block verdict
        if: steps.adversary.outcome == 'failure'
        run: |
          echo "PR gate blocked — see report comment."
          exit 1
