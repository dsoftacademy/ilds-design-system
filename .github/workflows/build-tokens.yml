name: Build Design Tokens

# Regenerates ALL platform token exports from tokens/tokens.json whenever the token
# source or a generator changes, then commits the refreshed outputs back to main so
# every platform stays in lockstep:
#   - dist/tokens.css / tokens.theme.css / tailwind-tokens.js  (web — Style Dictionary)
#   - dist/ILDSTokens.swift                                     (iOS — Style Dictionary)
#   - dist/IldsTokens.kt                                        (Android — Style Dictionary)
#   - lib/design_system/ilds_tokens.dart                       (Flutter — Dart codegen)
# A cross-platform parity guard (npm run verify:tokens) fails the build if any export
# drifts from the source of truth.

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'tokens/tokens.json'
      - 'style-dictionary.config.mjs'
      - 'tool/generate_ilds_tokens.dart'
      - 'tool/verify_token_exports.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

concurrency:
  group: build-tokens-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Export tokens (web + Swift + Compose + Flutter)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Flutter (provides Dart for codegen)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Node dependencies
        run: npm ci

      - name: Resolve Dart/Flutter packages
        run: flutter pub get

      - name: Build web + native token exports (CSS + Tailwind + Swift + Compose)
        run: npm run build:tokens

      - name: Generate Flutter token class
        run: dart run tool/generate_ilds_tokens.dart

      - name: Verify cross-platform parity (source of truth guard)
        run: npm run verify:tokens

      - name: Commit regenerated exports (if changed)
        run: |
          set -euo pipefail
          CHANGED="$(git status --porcelain dist/ lib/design_system/ilds_tokens.dart)"
          if [ -z "$CHANGED" ]; then
            echo "No token export changes — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            dist/tokens.css \
            dist/tokens.theme.css \
            dist/tailwind-tokens.js \
            dist/ILDSTokens.swift \
            dist/IldsTokens.kt \
            lib/design_system/ilds_tokens.dart
          git commit -m "ci: rebuild token exports — web + Swift + Compose + Flutter [skip ci]"
          git push
          echo "✅ Committed refreshed token exports (all platforms)."
