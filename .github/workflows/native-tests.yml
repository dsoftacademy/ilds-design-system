name: Native Component Tests

# Compile + cross-platform parity QA for iOS (SwiftUI), Android (Compose), and Flutter.
# All three platforms must pass; the parity matrix (verify:parity) and file-existence
# guard (verify:phase4b) both run so neither can silently regress.

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'android/**'
      - 'lib/**'
      - 'dist/ILDSTokens.swift'
      - 'dist/IldsTokens.kt'
      - 'tokens/**'
      - 'style-dictionary.config.mjs'
      - 'tool/verify_phase4b.mjs'
      - 'tool/verify_cross_platform_parity.mjs'
      - 'pubspec.yaml'
      - 'test/golden/**'
      - 'test/goldens/**'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'android/**'
      - 'lib/**'
      - 'dist/ILDSTokens.swift'
      - 'dist/IldsTokens.kt'
      - 'tokens/**'
      - 'style-dictionary.config.mjs'
      - 'tool/verify_phase4b.mjs'
      - 'tool/verify_cross_platform_parity.mjs'
      - 'pubspec.yaml'
      - 'test/golden/**'
      - 'test/goldens/**'

jobs:
  verify:
    name: Cross-platform parity QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: File-existence guard (Phase 4b)
        run: npm run verify:phase4b
      - name: Cross-platform parity matrix (64 checks)
        run: npm run verify:parity

  flutter-golden:
    name: Flutter golden tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Run golden tests
        run: flutter test test/golden/
      - name: Upload golden diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-golden-failures
          path: test/goldens/failures/

  flutter:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Analyze (catches undefined symbols, type errors)
        run: flutter analyze lib/

  ios:
    name: iOS compile (Swift Package)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift build
        run: swift build
        working-directory: ios

  android:
    name: Android compile (Compose library)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: compileDebugKotlin
        run: ./gradlew :ilds-design-system:compileDebugKotlin --no-daemon
        working-directory: android
