name: Sync Figma Tokens

# Fetches Figma Variables for the ILDS file and opens a PR if tokens/tokens.json
# has changed. The PR triggers build-tokens.yml automatically on merge, which
# rebuilds all platform dist/* outputs (CSS, Swift, Kotlin, Dart).
#
# Secrets required (GitHub → Settings → Secrets → Actions):
#   FIGMA_ACCESS_TOKEN — Figma Personal Access Token with file_variables:read scope.
#   GITHUB_TOKEN       — automatically available in all Actions workflows.

on:
  # Disabled: requires Figma Enterprise file_variables:read on PAT.
  # Use ilds-plugin/ (Plugin API) instead — see ilds-plugin/README.md
  workflow_dispatch:
  # schedule:
  #   - cron: '0 9 * * 1-5'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Fetch Figma Variables and open PR if changed
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch Figma Variables and update tokens.json
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: node tool/sync_figma_tokens.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet tokens/tokens.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR branch if tokens changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          BRANCH="token-sync/auto-$(date +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add tokens/tokens.json
          git commit -m "chore(tokens): sync Figma Variables to tokens.json [$(date +%Y-%m-%d)]"
          git push origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.ILDS_AUTO_MERGE_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::ILDS_AUTO_MERGE_TOKEN required for bot-authored PRs (L3)."
            exit 1
          fi
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(tokens): sync Figma Variables [$(date +%Y-%m-%d)]" \
            --body "Automated token sync from Figma file PCUj412f0Z1zZLLxQUX22e. Review tokens/tokens.json before merge; build-tokens.yml runs after merge."

      - name: No changes
        if: steps.diff.outputs.changed == 'false'
        run: echo "tokens/tokens.json is already in sync with Figma. No PR needed."
