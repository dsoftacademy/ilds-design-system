name: Chromatic Visual Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'web/src/**'
      - 'web/specs/**'
      - 'dist/tokens.theme.css'
      - 'tokens/**'
      - 'chromatic.config.json'
      - '.github/workflows/chromatic.yml'
  push:
    branches: [main]
    paths:
      - 'web/src/**'
      - 'dist/tokens.theme.css'
      - 'chromatic.config.json'
      - '.github/workflows/chromatic.yml'

jobs:
  chromatic:
    name: Chromatic snapshot test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Verify Chromatic secret
        run: |
          if [ -z "${{ secrets.CHROMATIC_PROJECT_TOKEN }}" ]; then
            echo "::error::CHROMATIC_PROJECT_TOKEN is missing."
            exit 1
          fi
      - name: Build Storybook
        run: npm run build-storybook
        working-directory: web
      - name: Run Chromatic
        id: chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        working-directory: web
        run: |
          set -o pipefail
          npx chromatic \
            --storybook-build-dir=storybook-static \
            --debug \
            --log-file=chromatic-debug.log \
            2>&1 | tee chromatic-stdout.log
      - name: Publish Chromatic diagnostics
        if: always()
        working-directory: web
        run: |
          {
            echo "## Chromatic diagnostics"
            if [ -f chromatic-stdout.log ]; then
              echo '```text'
              tail -n 120 chromatic-stdout.log
              echo '```'
            else
              echo "_No stdout log captured._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Chromatic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromatic-logs
          path: |
            web/chromatic-debug.log
            web/chromatic-stdout.log
