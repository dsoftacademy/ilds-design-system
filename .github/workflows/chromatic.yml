name: Chromatic Visual Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'web/src/**'
      - 'web/specs/**'
      - 'dist/tokens.theme.css'
      - 'tokens/**'
      - 'chromatic.config.json'
  push:
    branches: [main]
    paths:
      - 'web/src/**'
      - 'dist/tokens.theme.css'
      - 'chromatic.config.json'

jobs:
  chromatic:
    name: Chromatic snapshot test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Verify Chromatic secret
        run: |
          if [ -z "${{ secrets.CHROMATIC_PROJECT_TOKEN }}" ]; then
            echo "::error::CHROMATIC_PROJECT_TOKEN is missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Build Storybook
        run: npm run build-storybook
        working-directory: web
      - name: Run Chromatic
        uses: chromaui/action@v17
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: web
          storybookBaseDir: web
          storybookBuildDir: storybook-static
          buildScriptName: build-storybook
          exitZeroOnChanges: true
          autoAcceptChanges: main
          debug: true
          logFile: chromatic-debug.log
      - name: Upload Chromatic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromatic-logs
          path: |
            web/chromatic-debug.log
            web/build-storybook.log
