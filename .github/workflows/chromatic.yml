name: Chromatic Visual Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'web/src/**'
      - 'web/specs/**'
      - 'dist/tokens.theme.css'
      - 'tokens/**'
      - 'docs/**'
      - 'lib/**'
      - 'test/**'
      - '.github/workflows/chromatic.yml'
  push:
    branches: [main]
    paths:
      - 'web/src/**'
      - 'dist/tokens.theme.css'
      - '.github/workflows/chromatic.yml'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      chromatic: ${{ steps.filter.outputs.chromatic }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            chromatic:
              - 'web/src/**'
              - 'web/specs/**'
              - 'dist/tokens.theme.css'
              - 'tokens/**'
              - 'docs/**'
              - '.github/workflows/chromatic.yml'

  chromatic:
    name: Chromatic snapshot test
    needs: changes
    if: needs.changes.outputs.chromatic == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Verify Chromatic secret
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CHROMATIC_PROJECT_TOKEN}" ]; then
            echo "::error::CHROMATIC_PROJECT_TOKEN is missing."
            exit 1
          fi
          token="$(printf '%s' "$CHROMATIC_PROJECT_TOKEN" | tr -d '\r\n')"
          if printf '%s' "$token" | grep -q '[[:space:]]'; then
            echo "::error::CHROMATIC_PROJECT_TOKEN must be the token only (starts with chpt_), not a shell command."
            exit 1
          fi
          if ! [[ "$token" =~ ^chpt_[a-z0-9]+$ ]]; then
            echo "::error::CHROMATIC_PROJECT_TOKEN must match chpt_<hex>. Copy Project token from chromatic.com → Manage (not the npx command)."
            exit 1
          fi
      - name: Build Storybook
        run: npm run build-storybook
        working-directory: web
      - name: Run Chromatic
        id: chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        working-directory: web
        run: |
          set -o pipefail
          token="$(printf '%s' "$CHROMATIC_PROJECT_TOKEN" | tr -d '\r\n')"
          npx chromatic \
            --project-token="$token" \
            --storybook-build-dir=storybook-static \
            --auto-accept-changes=main \
            --exit-zero-on-changes \
            --diagnostics-file=chromatic-diagnostics.json \
            --log-file=chromatic-debug.log \
            2>&1 | tee chromatic-stdout.log
      - name: Publish Chromatic diagnostics
        if: always()
        working-directory: web
        run: |
          {
            echo "## Chromatic output"
            echo '```text'
            tail -n 120 chromatic-stdout.log 2>/dev/null || echo "no stdout"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, re
          from pathlib import Path

          def load_diag():
              p = Path("chromatic-diagnostics.json")
              if p.exists():
                  try:
                      return json.loads(p.read_text())
                  except json.JSONDecodeError:
                      pass
              log = Path("chromatic-stdout.log").read_text() if Path("chromatic-stdout.log").exists() else ""
              blocks = re.findall(r"\{[^{}]*\"exitCodeKey\"[\s\S]*?\}\s*$", log, re.M)
              for block in reversed(blocks):
                  try:
                      return json.loads(block)
                  except json.JSONDecodeError:
                      continue
              return {}

          data = load_diag()
          if data:
              print("## Parsed Chromatic result")
              for key in ("exitCode", "exitCodeKey", "errorMessage", "isolatorUrl", "buildUrl"):
                  if data.get(key) is not None:
                      print(f"- {key}: {data.get(key)}")
          PY
          if [ -f chromatic-diagnostics.json ]; then
            err=$(python3 -c "import json; print(json.load(open('chromatic-diagnostics.json')).get('errorMessage',''))" 2>/dev/null || true)
            if [ -n "$err" ]; then
              echo "::error::$err"
            fi
          fi
      - name: Upload Chromatic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromatic-logs
          path: |
            web/chromatic-debug.log
            web/chromatic-stdout.log
            web/chromatic-diagnostics.json

  chromatic-skip:
    name: Chromatic snapshot test
    needs: changes
    if: needs.changes.outputs.chromatic != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No web/token paths changed — Chromatic skipped."
