name: Chromatic Visual Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'web/src/**'
      - 'web/specs/**'
      - 'dist/tokens.theme.css'
      - 'tokens/**'
  push:
    branches: [main]
    paths:
      - 'web/src/**'
      - 'dist/tokens.theme.css'

jobs:
  chromatic:
    name: Chromatic snapshot test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Verify Chromatic secret
        run: |
          if [ -z "${{ secrets.CHROMATIC_PROJECT_TOKEN }}" ]; then
            echo "::error::CHROMATIC_PROJECT_TOKEN is missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "CHROMATIC_PROJECT_TOKEN is set."
      - name: Build Storybook
        run: npm run build-storybook
        working-directory: web
      - name: Run Chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: >
          npx chromatic
          --storybook-build-dir=storybook-static
          --build-script-name=build-storybook
          --exit-zero-on-changes
          --auto-accept-changes=main
          --storybook-log-file=chromatic-storybook.log
        working-directory: web
      - name: Upload Chromatic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromatic-logs
          path: |
            web/chromatic-storybook.log
            web/build-storybook.log
